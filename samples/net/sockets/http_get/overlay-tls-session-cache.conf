# Persistent TLS session cache via NVS
# Usage: west build -b <board> samples/net/sockets/http_get -- \
#   -DOVERLAY_CONFIG="overlay-tls.conf overlay-tls-session-cache.conf"

CONFIG_HTTP_GET_TLS_SESSION_CACHE=y

# Enable TLS 1.3 and session tickets for session resumption.
# Most modern servers (e.g. Google) require session tickets
# and do not support TLS 1.2 session ID-based resumption.
CONFIG_MBEDTLS_SSL_PROTO_TLS1_3=y
CONFIG_MBEDTLS_SSL_SESSION_TICKETS=y

# Session tickets require an AEAD cipher (GCM, CCM, or ChaCha20-Poly1305).
# GCM is also required for TLS 1.3 ciphersuites.
CONFIG_PSA_WANT_ALG_GCM=y

CONFIG_NET_SOCKETS_TLS_MAX_CLIENT_SESSION_COUNT=2

CONFIG_SETTINGS=y
CONFIG_NET_SOCKETS_TLS_SESSION_CACHE_PERSISTENT=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
